name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm test

    - name: Deploy to EC2   # ✅ FIXED INDENTATION
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Connected to EC2 ✅"
          sudo apt update -y
          sudo apt install nodejs npm git -y
          rm -rf app
          git clone https://github.com/tejanaveengit/poc19-nodejs-branching.git app
          cd app
          npm install
          pkill node || true
          nohup npm start > app.log 2>&1 &
